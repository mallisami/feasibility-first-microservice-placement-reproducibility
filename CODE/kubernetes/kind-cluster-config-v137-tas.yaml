kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
  - |
    apiVersion: kubeadm.k8s.io/v1beta4
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        - name: feature-gates
          value: GenericWorkload=true,TopologyAwareWorkloadScheduling=true,CompositePodGroup=true
        - name: runtime-config
          value: scheduling.k8s.io/v1beta1=true,scheduling.k8s.io/v1alpha3=true
    controllerManager:
      extraArgs:
        - name: feature-gates
          value: GenericWorkload=true,TopologyAwareWorkloadScheduling=true,CompositePodGroup=true
    scheduler:
      extraArgs:
        - name: feature-gates
          value: GenericWorkload=true,TopologyAwareWorkloadScheduling=true,CompositePodGroup=true
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
