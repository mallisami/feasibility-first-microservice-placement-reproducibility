apiVersion: v1
kind: Namespace
metadata:
  name: mape-cap-app-b
  labels:
    mape-cap-bplus/application: app-b
    mape-cap-bplus/topology: mesh-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mape-cap-app-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: hashicorp/http-echo:1.0.0
          args: ["-text=app-b-gateway"]
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-svc
  namespace: mape-cap-app-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-svc
  template:
    metadata:
      labels:
        app: user-svc
    spec:
