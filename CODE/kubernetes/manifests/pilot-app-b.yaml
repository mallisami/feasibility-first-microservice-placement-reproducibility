            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-svc
  namespace: mape-cap-app-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-svc
  template:
    metadata:
      labels:
        app: catalog-svc
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: catalog-svc
                topologyKey: kubernetes.io/hostname
      containers:
        - name: catalog-svc
          image: hashicorp/http-echo:1.0.0
          args: ["-text=app-b-catalog-svc"]
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 1
            periodSeconds: 2
---
