apiVersion: apps/v1
kind: Deployment
metadata:
  name: relocation-echo
  namespace: mape-cap-bplus-pilot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: relocation-echo
  template:
    metadata:
      labels:
        app: relocation-echo
      annotations:
        mape-cap-bplus/relocation-id: initial
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0.0
          args: ["-text=MAPE-CAP-BPlus-relocation"]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 1
            periodSeconds: 1
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: relocation-echo-pdb
  namespace: mape-cap-bplus-pilot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: relocation-echo
---
apiVersion: v1
kind: Service
metadata:
  name: relocation-echo
  namespace: mape-cap-bplus-pilot
spec:
  selector:
    app: relocation-echo
  ports:
    - port: 80
      targetPort: 5678
